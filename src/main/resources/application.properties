spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/wordle?currentSchema=wordle
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.default_schema=wordle
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=wordle
spring.liquibase.liquibase-schema=wordle
server.port=8082
server.servlet.context-path=/wordle_02

spring.profiles.active=jpa
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.liquibase=DEBUG
logging.file.name=wordle-app.log