spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/wordle?currentSchema=wordle
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        default_schema: wordle

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    default-schema: wordle
    liquibase-schema: wordle

  profiles:
    active: jpa

server:
  port: 8082
  servlet:
    context-path: /wordle_02

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    liquibase: DEBUG
  file:
    name: wordle-app.log