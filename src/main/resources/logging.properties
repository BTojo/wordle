handlers=java.util.logging.FileHandler
.level=INFO
java.util.logging.FileHandler.level=FINE
java.util.logging.FileHandler.pattern=logs/main.log
java.util.logging.FileHandler.limit=50000
java.util.logging.FileHandler.count=1
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[%1$tT] %3$s %4$s: %5$s%6$s%n
ru.wordle.level=FINE
ru.wordle.handlers=java.util.logging.FileHandler
ru.wordle.useParentHandlers=true
